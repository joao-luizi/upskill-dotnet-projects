<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8" />
    <title>Gestão de Veículos</title>
<link rel="stylesheet" href="./css/styles.css">

</head>

<body>
    <div id="topo">
        <div id="profile-container">
            <img id="profile-img" class="loginElement" src="./images/ProfileGuest.png" alt="">
            <div id="loginMsg" class="loginElement">Welcome Guest!</div>
             <form id="formLogin" class="hidden">
                <input type="text" id="username" placeholder="UserName" required />
                <input type="password" id="password" placeholder="Password" required />
                 <button type="submit">Login</button>
             </form>
             <button id= "btlogout" class="hidden">Log out</button>
        </div>
        <h1>Gestão de Veículos</h1>

        <button id="carregarLS">(Re)Inicializar BD</button>
        <button id="limparLS">Limpar BD</button>

        <h2>Adicionar / Editar Veículo</h2>
        <form id="formVeiculo">
            <input type="hidden" id="VeiculoID" />
            <input type="text" id="marca" placeholder="Marca" required />
            <input type="text" id="modelo" placeholder="Modelo" required />
            <input type="number" id="ano" placeholder="Ano" required />
            <input type="date" id="inspecao" />
            <label>Vendido</label><input type="checkbox" id="vendido"/>
            <button type="submit">Guardar</button>
        </form>
        
        <h2>Filtros</h2>
        <div class="display-flex">            
            <div class="display-flex">
                <select id="fMarca"  multiple = "true", size = "1">
                    <option value="0">Todas as marcas</option>
                </select>
                <button sortKey ="marca" class ="orderButton" id="fMarcaSortOrder">
                ↑
                </button>
            </div>
            <div class="display-flex">
                <select id="fModelo" multiple = "true", size = "1">
                    <option value="0">Todas os modelos</option>
                </select>
                <button sortKey ="modelo" class ="orderButton" id="fModeloSortOrder">
                ↑
                </button>
            </div>
            <div class="display-flex">
                <select id="fAno"  multiple = "true", size = "1">
                    <option value="0">Todos os anos</option>
                </select>
                <button sortKey ="ano" class ="orderButton" id="fAnoSortOrder">
                ↑
                </button>
            </div>
            <div>
                <select id="fVendido">
                    <option value="">Todos</option>
                    <option value="false">Disponíveis</option>
                    <option value="true">Vendidos</option>
                </select>
            </div>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Ano</th>
                <th>Última Inspeção</th>
                <th>Estado</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela"></tbody>
    </table>

<script src="./js/utils.js"></script>
<script src="./js/db.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/app.js"></script>
<script>
    Init()
</script>
</body>

</html>
